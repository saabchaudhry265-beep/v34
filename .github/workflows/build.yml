name: Build Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: python -m PyInstaller --noconfirm --clean tropy_eldorii.spec
      - run: Compress-Archive -Path "dist/Tropy Eldorii" -DestinationPath Tropy_Eldorii_v34_win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tropy_Eldorii_v34_win64
          path: Tropy_Eldorii_v34_win64.zip
